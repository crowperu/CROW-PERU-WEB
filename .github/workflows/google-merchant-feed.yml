name: CROW PE Google Merchant Feed
on:
  workflow_dispatch:
  push:
    paths:
      - "catalog/generate_merchant_feed.py"
      - ".github/workflows/google-merchant-feed.yml"
  schedule:
    # 22:16 en Peru, ~2 horas antes de la descarga de Merchant Center a las 00:00.
    - cron: "16 3 * * *"
permissions:
  contents: write
concurrency:
  group: crow-pe-merchant-feed
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate XML from read-only public product catalog
        env:
          SUPABASE_URL: https://nszdjsuhaeudvbtsekew.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CROW_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 catalog/generate_merchant_feed.py
      - name: Commit validated feed only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-merchant-pe.xml
          if git diff --staged --quiet; then
            echo "Catalog unchanged"
            exit 0
          fi
          git commit -m "Refresh Google Merchant catalog for Peru"
          git push origin HEAD:main
