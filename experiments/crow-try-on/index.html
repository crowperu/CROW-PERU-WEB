<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CROW TRY ON · Prototipo aislado</title>
<style>body{font-family:Arial,sans-serif;background:#fff;color:#111;margin:0;padding:24px;max-width:750px;margin:auto}h1{letter-spacing:.14em}button,input{padding:12px;margin:5px;border:1px solid #222;background:white;color:#111}button:focus-visible{outline:3px solid #777}#stage{position:relative;width:100%;aspect-ratio:3/4;background:#eee;overflow:hidden}video,#photo{position:absolute;width:100%;height:100%;object-fit:contain}video{transform:scaleX(-1)}#photo{display:none}#earrings{position:absolute;left:50%;top:45%;width:58%;height:18%;transform:translate(-50%,-50%);pointer-events:none;display:flex;justify-content:space-between}#earrings svg{width:26%;height:100%;filter:drop-shadow(1px 2px 2px #777)}small{color:#555}label{display:block;margin:12px 0}input[type=range]{width:75%}</style></head>
<body><h1>CROW TRY ON</h1><p>Prototipo privado. Aretes ilustrativos, no productos reales de CROW. Ajuste manual; aún no incluye detección facial.</p>
<div><button id="camera">Activar cámara</button><label>O subir una selfie <input id="upload" type="file" accept="image/*"></label><button id="stop">Detener cámara</button></div>
<div id="stage"><video id="video" autoplay muted playsinline></video><img id="photo" alt="Selfie seleccionada"><div id="earrings"></div></div>
<label>Modelo <select id="model"><option value="hoop">Argolla dorada</option><option value="drop">Colgante dorado</option><option value="stud">Punto dorado</option></select></label>
<label>Altura <input id="y" type="range" min="15" max="80" value="45"></label><label>Separación <input id="spacing" type="range" min="25" max="95" value="58"></label><label>Tamaño <input id="size" type="range" min="8" max="35" value="18"></label>
<p><button id="save">Guardar vista previa</button></p><small>La cámara y la selfie permanecen en el dispositivo. No hay solicitudes de subida ni integración con pagos, pedidos o inventario. La vista previa es orientativa.</small>
<script>
const video=document.querySelector('#video'),photo=document.querySelector('#photo'),stage=document.querySelector('#stage'),earrings=document.querySelector('#earrings');let stream=null,objectUrl=null;
const shapes={hoop:'<ellipse cx="50" cy="55" rx="24" ry="36" fill="none" stroke="#bb903e" stroke-width="13"/>',drop:'<circle cx="50" cy="20" r="9" fill="#c59b49"/><path d="M50 30 Q5 90 50 99 Q95 90 50 30" fill="#c59b49"/>',stud:'<circle cx="50" cy="50" r="18" fill="#c59b49"/>'};
function render(){const shape=shapes[document.querySelector('#model').value];earrings.innerHTML=[0,1].map(()=>'<svg viewBox="0 0 100 110" aria-hidden="true">'+shape+'</svg>').join('');earrings.style.top=document.querySelector('#y').value+'%';earrings.style.width=document.querySelector('#spacing').value+'%';earrings.style.height=document.querySelector('#size').value+'%'}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
document.querySelector('#camera').onclick=async()=>{stop();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});photo.style.display='none';video.style.display='block';video.srcObject=stream}catch(e){alert('No se pudo abrir la cámara. Usa HTTPS y revisa los permisos.')}};
document.querySelector('#stop').onclick=stop;
document.querySelector('#upload').onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith('image/'))return;stop();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);photo.src=objectUrl;photo.style.display='block';video.style.display='none'};
['model','y','spacing','size'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.querySelector('#save').onclick=async()=>{
const source=photo.style.display==='block'?photo:video;
if(source===video&&!stream)return alert('Activa la cámara o sube una selfie');
const w=source.videoWidth||source.naturalWidth,h=source.videoHeight||source.naturalHeight;if(!w||!h)return alert('La imagen aún no está lista');
const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1200;const ctx=canvas.getContext('2d');
ctx.fillStyle='#eee';ctx.fillRect(0,0,900,1200);
const scale=Math.min(900/w,1200/h),dw=w*scale,dh=h*scale;
ctx.save();if(source===video){ctx.translate(900,0);ctx.scale(-1,1);ctx.drawImage(source,(900-dw)/2,(1200-dh)/2,dw,dh)}
else ctx.drawImage(source,(900-dw)/2,(1200-dh)/2,dw,dh);ctx.restore();
const nodes=[...earrings.querySelectorAll('svg')],stageRect=stage.getBoundingClientRect();
for(const node of nodes){
const box=node.getBoundingClientRect(),img=new Image(),data=new XMLSerializer().serializeToString(node);
await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(data)});
ctx.drawImage(img,(box.left-stageRect.left)/stageRect.width*900,(box.top-stageRect.top)/stageRect.height*1200,box.width/stageRect.width*900,box.height/stageRect.height*1200)
}
canvas.toBlob(blob=>{if(!blob)return alert('No se pudo crear la imagen');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='crow-try-on-preview.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)},'image/png');
};
window.addEventListener('pagehide',()=>{stop();if(objectUrl)URL.revokeObjectURL(objectUrl)});render();
</script></body></html>
